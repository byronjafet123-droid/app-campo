<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ganadería</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a09">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Barlow+Semi+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday field tool, plain and sturdy
   IDEA a weatherproof field notebook: one card per animal, big numbers readable in the sun
   PICTURE the herd itself: animal cards with photo and large ear-tag number
   COLOUR black ground, dark grey cards, bold white text; muted olive, terracotta, ochre accents; "Modo sol" flips to white/black
   TYPE Barlow Semi Condensed 800 for numbers and titles + Barlow 700 for text
   LAYOUT phone: top bar, content, bottom tab bar. Desktop: left side menu, wider grids, two-column animal file */
:root{color-scheme:dark;--bg:#0a0a09;--card:#1b1b19;--card2:#262623;--line:#3a3a36;--ink:#fff;--soft:#d6d3ca;--oli:#5f6e34;--ter:#9a4e35;--ocr:#a07c35;--ok:#a9bf6a;--bad:#e08a6c;--btxt:#fff}
:root.sol{color-scheme:light;--bg:#fff;--card:#f0efea;--card2:#e2e0d8;--line:#bdbab0;--ink:#000;--soft:#2a2a27;--oli:#4c5a25;--ter:#8a3f27;--ocr:#7d5e1f;--ok:#3d5a12;--bad:#9a2f12;--btxt:#fff}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:700 17px/1.45 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.num{font-family:"Barlow Semi Condensed",Barlow,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(28px,6vw,38px);line-height:1.05}
h2{font-size:22px;line-height:1.1;margin:26px 0 10px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{min-height:100%;display:grid;grid-template-rows:auto 1fr auto}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:2px solid var(--line)}
.top .t{flex:1;font:800 20px/1.1 "Barlow Semi Condensed",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-height:44px;min-width:44px;padding:0 12px;border:2px solid var(--line);background:var(--card);border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800}
.ib svg{width:22px;height:22px}
main{padding:16px 16px 110px;width:100%;max-width:1180px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{min-height:62px;border:0;background:none;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--soft)}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--ink);box-shadow:inset 0 4px 0 var(--ocr)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;min-height:64px}
.row .g{flex:1}
.row .big{font:800 22px/1.1 "Barlow Semi Condensed",sans-serif}
.row .sm{color:var(--soft);font-size:15px}
.chev{width:22px;height:22px;flex:none;color:var(--soft)}
.add{width:100%;min-height:60px;border:2px dashed var(--soft);background:none;border-radius:14px;font-weight:800;font-size:18px}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.quick button{min-height:88px;border:0;border-radius:14px;color:var(--btxt);font:800 21px/1.1 "Barlow Semi Condensed",sans-serif;text-align:left;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.quick svg{width:28px;height:28px}
.b-oli{background:var(--oli)}.b-ter{background:var(--ter)}.b-ocr{background:var(--ocr)}.b-gr{background:#3b3b37}
:root.sol .b-gr{background:#3b3b37}
.search{width:100%;min-height:58px;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:0 16px;font-size:20px;font-weight:800}
.search:focus,input:focus,select:focus,textarea:focus{outline:3px solid var(--ocr);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5em,1fr));gap:10px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .l{color:var(--soft);font-size:15px}
.stat .v{font:800 clamp(24px,6vw,30px)/1.1 "Barlow Semi Condensed",sans-serif;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.herd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.an{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0}
.an .ph{aspect-ratio:4/3;background:var(--card2);display:block;width:100%}
.an .ph img,.an .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.an .tx{padding:8px 10px 10px}
.an .sn{color:var(--soft);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 4px}
.an .ar{font:800 26px/1 "Barlow Semi Condensed",sans-serif}
.chip{display:inline-block;font-size:14px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--soft)}
.chip.v{background:var(--ocr);color:#fff}.chip.m{background:var(--ter);color:#fff}.chip.c{background:var(--line);color:var(--ink)}
.desg dt.tot,.desg dd.tot{font-size:19px;color:var(--ink);border-bottom-width:3px}
.desg dd.tot{font-size:23px}
.desg{max-width:640px}
.desg dt:last-of-type,.desg dd:last-of-type{border-bottom:0}
.quick svg{width:32px;height:32px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.btn{min-height:50px;padding:0 16px;border:0;border-radius:12px;color:var(--btxt);font-weight:800;font-size:17px}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.file{display:grid;gap:16px}
.fphoto{border-radius:14px;overflow:hidden;background:var(--card2);aspect-ratio:4/3;position:relative}
.fphoto img,.fphoto svg{width:100%;height:100%;object-fit:cover;display:block}
.fphoto label{position:absolute;right:10px;bottom:10px}
.dl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0;margin:0}
.dl dt,.dl dd{padding:10px 0;border-bottom:2px solid var(--line);margin:0}
.dl dt{color:var(--soft);padding-right:16px}
.dl dd{text-align:right;font:800 19px/1.3 "Barlow Semi Condensed",sans-serif}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tl li{background:var(--card);border:2px solid var(--line);border-left:6px solid var(--ocr);border-radius:10px;padding:10px 12px}
.tl li.ap{border-left-color:var(--oli)}.tl li.ve{border-left-color:var(--ter)}
.tl .d{color:var(--soft);font-size:15px}
.money{white-space:nowrap}
.note{color:var(--soft);font-size:15px;margin:10px 0}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet form{background:var(--bg);border:2px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0))}
.sheet h3{font-size:24px;margin-bottom:12px}
.f{display:grid;gap:4px;margin-bottom:12px}
.f label{color:var(--soft);font-size:15px}
.f input,.f select,.f textarea{min-height:50px;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:18px;font-weight:800;width:100%}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.5em,1fr));gap:8px;margin-bottom:12px}
.checks label{display:flex;align-items:center;gap:6px;min-height:46px;padding:0 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-weight:800}
.checks input{width:20px;height:20px}
.err{color:var(--bad);min-height:1.4em}
.sheet .end{display:flex;gap:10px;position:sticky;bottom:-18px;background:var(--bg);padding-top:8px}
.sheet .end .btn{flex:1}
.empty{padding:18px;text-align:center;color:var(--soft);border:2px dashed var(--line);border-radius:14px}
.res a,.res button{text-decoration:none}
.hidden{display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:40;background:var(--oli);color:#fff;font-weight:800;padding:12px 22px;border-radius:999px;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.upd{position:fixed;left:12px;right:12px;top:10px;z-index:45;min-height:48px;border:0;border-radius:12px;background:var(--ocr);color:#fff;font-weight:800;font-size:16px}
@media(min-width:600px){.herd{grid-template-columns:repeat(3,minmax(0,1fr))}.quick{grid-template-columns:repeat(4,minmax(0,1fr))}.sheet{align-items:center}.sheet form{border-radius:18px;border-bottom:2px solid var(--line)}}
@media(min-width:900px){
.app{grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto 1fr}
.top{grid-column:2}
nav{position:sticky;top:0;grid-row:1/3;grid-column:1;height:100vh;display:flex;flex-direction:column;border-top:0;border-right:2px solid var(--line);padding:16px 10px;gap:6px}
nav::before{content:"GANADERÍA";font:800 22px/1 "Barlow Semi Condensed",sans-serif;color:var(--ink);padding:6px 12px 18px}
nav button{flex-direction:row;justify-content:flex-start;padding:0 12px;border-radius:10px;min-height:52px;font-size:18px;gap:10px}
nav button.on{box-shadow:none;background:var(--card2)}
main{grid-column:2;padding:22px 28px 40px}
.herd{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.file{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="ib hidden" id="back" aria-label="Atrás"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="t" id="ttl">Inicio</div>
    <button class="ib" id="sol" aria-label="Modo sol"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg><span>Modo sol</span></button>
  </header>
  <main id="main"></main>
  <nav id="nav">
    <button data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>Inicio</button>
    <button data-tab="fincas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 20h20M4 20V10l8-5 8 5v10"/><path d="M9 20v-5h6v5"/></svg>Fincas</button>
    <button data-tab="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Histórico</button>
    <button data-tab="mas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Exportar</button>
  </nav>
</div>
<div id="sheet"></div>
<script>
{
const KEY='ganaderia-modelo-v1';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const col=n=>'₡'+Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const fec=s=>{if(!s)return '';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const chev='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 5l7 7-7 7"/></svg>';
const calf=`<svg viewBox="0 0 160 120" preserveAspectRatio="xMidYMid slice"><rect width="160" height="120" fill="var(--card2)"/><g fill="var(--line)"><ellipse cx="78" cy="64" rx="40" ry="22"/><rect x="48" y="76" width="9" height="30" rx="3"/><rect x="62" y="78" width="9" height="28" rx="3"/><rect x="90" y="78" width="9" height="28" rx="3"/><rect x="104" y="76" width="9" height="30" rx="3"/><path d="M112 50l20-6c8 0 12 6 12 14l-2 12c-1 4-6 6-10 4l-18-8z"/><path d="M128 44l8-10 4 3-6 10z"/><path d="M38 60c-8 2-12 10-10 20l4-1c-1-7 1-13 7-15z"/></g></svg>`;

const vacio=()=>({fincas:[{id:'f1',nombre:'Finca 1'},{id:'f2',nombre:'Finca 2'}],hatos:[],animales:[],aplicaciones:[],gastos:[],traslados:[],ventas:[],sol:false,respaldo:''});
const idb=new Promise((res,rej)=>{const r=indexedDB.open('ganaderia',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbDel=k=>idb.then(db=>new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)}));
const idbGet=k=>idb.then(db=>new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
const idbSet=(k,v)=>idb.then(db=>new Promise((res,rej)=>{let t;try{t=db.transaction('kv','readwrite',{durability:'strict'})}catch(_){t=db.transaction('kv','readwrite')}t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}));
let D=null,saving=Promise.resolve(),persistente=false;
const save=()=>{saving=saving.then(()=>idbSet('datos',D)).catch(()=>alertSheet('No se pudo guardar el último cambio. Revisá que el teléfono tenga espacio libre y volvé a intentarlo.'))};

const finca=id=>D.fincas.find(x=>x.id===id);
const hato=id=>D.hatos.find(x=>x.id===id);
const animal=id=>D.animales.find(x=>x.id===id);
const hatosDe=f=>D.hatos.filter(h=>h.finca===f);
const animalesDe=h=>D.animales.filter(a=>a.hato===h);
const venta=aid=>D.ventas.find(v=>v.animal===aid);
const sanidadDe=aid=>D.aplicaciones.filter(p=>p.animales.includes(aid)).reduce((s,p)=>s+p.costo/p.animales.length,0);
function cuentas(hid){
  const an=animalesDe(hid);
  const compra=an.reduce((s,a)=>s+(+a.costo||0),0);
  const san=an.reduce((s,a)=>s+sanidadDe(a.id),0);
  const gs=D.gastos.filter(g=>g.hato===hid);
  const por=t=>gs.filter(g=>g.tipo===t).reduce((s,g)=>s+(+g.monto||0),0);
  const ali=por('Alimentación'),tra=por('Transporte'),gas=gs.reduce((s,g)=>s+(+g.monto||0),0),otr=gas-ali-tra;
  const ven=an.reduce((s,a)=>{const v=venta(a.id);return s+(v&&v.tipo==='Venta'?(+v.precio||0)-(+v.rebajo||0):0)},0);
  return{an,activos:an.filter(a=>a.estado==='activo').length,compra,san,ali,tra,otr,gas,ven,inv:compra+san+gas,res:ven-compra-san-gas};
}
function sumar(list){const z={an:[],activos:0,compra:0,san:0,ali:0,tra:0,otr:0,gas:0,ven:0,inv:0,res:0};list.forEach(c=>{for(const k in z)k==='an'?z.an.push(...c.an):z[k]+=c[k]});return z}
const signo=v=>`<span class="money ${v>=0?'pos':'neg'}">${v<0?'−':''}${col(Math.abs(v))}</span>`;
function desglose(c,cerrado){
  return `<dl class="dl card desg"><dt>Compra de animales</dt><dd class="money">${col(c.compra)}</dd><dt>Sanidad</dt><dd class="money">${col(c.san)}</dd><dt>Alimentación</dt><dd class="money">${col(c.ali)}</dd><dt>Transporte</dt><dd class="money">${col(c.tra)}</dd><dt>Otros</dt><dd class="money">${col(c.otr)}</dd>
  <dt class="tot">Total gastado</dt><dd class="tot money">${col(c.inv)}</dd><dt>Vendido</dt><dd class="money">${col(c.ven)}</dd><dt class="tot">${cerrado?'Ganancia':'Resultado hasta hoy'}</dt><dd class="tot">${signo(c.res)}</dd></dl>`;
}
const ORD={activo:0,vendido:1,muerto:2};
const ordenar=l=>l.map((a,i)=>[a,i]).sort((x,y)=>(ORD[x[0].estado]??0)-(ORD[y[0].estado]??0)||x[1]-y[1]).map(x=>x[0]);
const foto=a=>a.foto?`<img src="${a.foto}" alt="Foto del animal ${esc(a.arete)}">`:calf;
const chipE=a=>a.estado==='vendido'?'<span class="chip v">Vendido</span>':a.estado==='muerto'?'<span class="chip m">Muerto</span>':'<span class="chip">Activo</span>';

let cur={v:'inicio',p:null},stack=[],q='';
const go=(v,p)=>{stack.push(cur);cur={v,p};render();scrollTo(0,0)};
const tab=v=>{stack=[];cur={v,p:null};render();scrollTo(0,0)};

const resHTML=()=>{if(!q)return '';const ql=q.toLowerCase();const res=D.animales.filter(a=>a.arete.toLowerCase().includes(ql)||(a.senas||'').toLowerCase().includes(ql));return res.length?res.map(a=>`<button class="row" data-go="animal:${a.id}"><div class="g"><div class="big">Arete ${esc(a.arete)}</div><div class="sm">${a.senas?esc(a.senas)+' · ':''}${esc(hato(a.hato)?.nombre)} · ${esc(finca(hato(a.hato)?.finca)?.nombre)}</div></div>${chipE(a)}${chev}</button>`).join(''):'<div class="empty">No hay ningún animal con ese arete</div>'};
const V={
inicio(){
  const act=D.animales.filter(a=>a.estado==='activo').length;
  const ab=D.hatos.filter(h=>h.estado==='abierto').length;
  const inv=D.hatos.filter(h=>h.estado==='abierto').reduce((s,h)=>s+cuentas(h.id).inv,0);
  const ult=[...D.aplicaciones.map(p=>({f:p.fecha,t:apTit(p)+' · '+p.animales.length+' animal'+(p.animales.length>1?'es':''),m:p.costo,c:'ap'})),...D.gastos.map(g=>({f:g.fecha,t:g.tipo+' · '+(hato(g.hato)?.nombre||''),m:g.monto,c:''})),...D.ventas.map(v=>({f:v.fecha,t:v.tipo+' · arete '+(animal(v.animal)?.arete||''),m:v.precio,c:'ve'}))].sort((a,b)=>b.f.localeCompare(a.f)).slice(0,5);
  return `<input class="search" id="q" type="search" placeholder="Buscar arete o señas…" value="${esc(q)}" aria-label="Buscar arete">
  <div class="list res" id="res" style="margin-top:10px">${resHTML()}</div>
  <div class="quick">
    <button class="b-oli" data-act="animal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>Nuevo animal</button>
    <button class="b-ocr" data-act="aplic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><g transform="rotate(-45 12 12)"><rect x="7" y="8.5" width="10" height="7" rx="1"/><path d="M17 12h3.5M20.5 9v6M7 12H1.5M10 8.5v3M13 8.5v3"/></g></svg>Aplicación</button>
    <button class="b-gr" data-act="gasto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="3"/></svg>Gasto</button>
    <button class="b-ter" data-act="venta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12l9-9h9v9l-9 9z"/><circle cx="16" cy="8" r="1.5"/></svg>Venta</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="l">Animales activos</div><div class="v num">${act}</div></div>
    <div class="stat"><div class="l">Hatos abiertos</div><div class="v num">${ab}</div></div>
    <div class="stat"><div class="l">Invertido en hatos abiertos</div><div class="v num money">${col(inv)}</div></div>
  </div>

function campos(f){const o={};for(const el of f.elements){if(!el.name||el.type==='file'||el.type==='hidden'&&el.name==='an')continue;if(el.name==='fotoData'&&!el.value)continue;if(el.type==='checkbox'){(o['__'+el.name]=o['__'+el.name]||[]);if(el.checked)o['__'+el.name].push(el.value)}else o[el.name]=el.value}return o}
function guardarBorrador(f,ya){clearTimeout(borrT);const go=()=>{if(!actual||!f.isConnected)return;idbSet('borrador',{act:actual,titulo:f.querySelector('h3').textContent,campos:campos(f),hora:Date.now()}).catch(()=>{})};ya?go():borrT=setTimeout(go,300)}
function cerrarSheet(){clearTimeout(borrT);box.innerHTML='';actual=null;idbDel('borrador').catch(()=>{})}
function sheet(title,html,onSave,label='Guardar'){
  box.innerHTML=`<div class="sheet"><form novalidate><h3>${title}</h3>${html}<div class="err" id="err"></div><div class="end"><button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn b-oli">${label}</button></div></form></div>`;
  const f=box.querySelector('form');
  f.onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(f));o._all=new FormData(f);const er=onSave(o,f);if(er){const el=f.querySelector('#err');el.textContent=er;el.scrollIntoView({block:'center',behavior:'smooth'});return}save();cerrarSheet();render();toast('Guardado ✓');if(after){const g=after;after=null;g()}};

const n=v=>+(String(v||'').replace(/\D/g,''))||0;

function fGasto(hid){
  const ho=hatosAbiertos();if(!ho.length)return alertSheet('Primero creá un hato en una finca.');
  const f=sheet('Gasto general',`${sel('Hato','hato',ho,hid||ho[0][0])}<div class="two">${fld('Fecha','fecha','date',today())}${sel('Tipo','tipo',[['Alimentación','Alimentación'],['Sal/Minerales','Sal/Minerales'],['Transporte','Transporte'],['Otro','Otro']],'Alimentación')}</div>

  box.querySelector('[data-close]').onclick=()=>box.innerHTML='';
  box.querySelector('#rdl').onclick=()=>{const u=URL.createObjectURL(file);const a=document.createElement('a');a.href=u;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);box.innerHTML='';marca()};
  box.querySelector('#rsh')?.addEventListener('click',()=>navigator.share({files:[file],title:file.name}).then(()=>{box.innerHTML='';marca()}).catch(e=>{if(e&&e.name!=='AbortError')box.querySelector('.note').innerHTML='No se pudo abrir el menú de compartir. Usá <b>Guardar en este aparato</b> y subilo a Drive después.'}));
}
function fRecuperar(file){actual=null;
  const fr=new FileReader();
  fr.onload=()=>{
    let r=null;try{r=JSON.parse(fr.result)}catch(e){}
    const d=r&&r.app==='app-campo'&&r.datos&&Array.isArray(r.datos.fincas)?r.datos:null;
    if(!d)return alertSheet('Ese archivo no es un respaldo de la app de campo.');
    const k=x=>Array.isArray(d[x])?d[x].length:0;
    sheet('Recuperar respaldo',`<p>Respaldo del <b>${fec(r.fecha)}</b>: ${k('fincas')} fincas, ${k('hatos')} hatos, ${k('animales')} animales.</p><p class="err">Esto reemplaza todo lo que hay ahora en este aparato (${D.fincas.length} fincas, ${D.hatos.length} hatos, ${D.animales.length} animales).</p>`,()=>{
      const sol=D.sol;D=Object.assign({fincas:[],hatos:[],animales:[],aplicaciones:[],gastos:[],traslados:[],ventas:[],sol:false,respaldo:''},d);D.sol=sol;stack=[];cur={v:'inicio',p:null};
    },'Sí, recuperar');
    box.querySelector('form button.b-oli').classList.replace('b-oli','b-ter');
  };
  fr.readAsText(file);
}

function shrink(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};im.src=fr.result};fr.readAsDataURL(file)})}

const FORMS=['animal','aplic','aplic1','editar','gasto','venta','tras','valor','hato','renFinca'];
const ACTS={animal:p=>fAnimal(p),aplic:p=>fAplic(p),aplic1:p=>fAplic(null,p),editar:p=>fAnimal(null,p),gasto:p=>fGasto(p),venta:p=>fVenta(p),tras:p=>fTras(p),valor:p=>fValor(p),hato:p=>fHato(p),renFinca:p=>fRen(p)};
function retomar(b){
  const t=Math.round((Date.now()-b.hora)/60000);
  box.innerHTML=`<div class="sheet"><form><h3>Tenés algo sin terminar</h3><p><b>${esc(b.titulo)}</b> · ${t<1?'hace un momento':t<60?'hace '+t+' min':'hace '+Math.round(t/60)+' h'}</p><p class="note">Lo que escribiste quedó guardado como borrador. ¿Seguimos donde ibas?</p><div class="end"><button type="button" class="btn ghost" id="bdes">Descartar</button><button type="button" class="btn b-oli" id="bsig">Seguir</button></div></form></div>`;
  box.querySelector('#bdes').onclick=cerrarSheet;
  box.querySelector('#bsig').onclick=()=>{box.innerHTML='';actual=b.act;try{ACTS[b.act.k](b.act.p)}catch(e){}const f=box.querySelector('form');if(!f||!actual)return cerrarSheet();
    if(f.hato&&b.campos.hato){f.hato.value=b.campos.hato;if(f.dataset.redraw)redraw[f.dataset.redraw]?.(f)}
    for(const[k,v]of Object.entries(b.campos)){if(k.startsWith('__')){f.querySelectorAll(`input[name="${k.slice(2)}"]`).forEach(c=>c.checked=v.includes(c.value))}else if(f.elements[k]&&k!=='hato')f.elements[k].value=v}
    if(b.campos.fotoData)f.querySelector('#fotoOk').textContent='Foto lista ✓';
  };
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){const[v,p]=g.dataset.go.split(':');go(v,p);return}
  const t=e.target.closest('[data-tab]');if(t){tab(t.dataset.tab);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const[k,p]=a.dataset.act.split(':');actual=FORMS.includes(k)?{k,p:p||null}:null;
  ({animal:()=>fAnimal(p),aplic:()=>fAplic(p),aplic1:()=>fAplic(null,p),editar:()=>fAnimal(null,p),hecha:()=>{const r=D.aplicaciones.find(x=>x.id===p);if(r){r.hecha=true;save();render()}},xls:()=>fExcel(p),respaldar:fRespaldar,gasto:()=>fGasto(p),venta:()=>fVenta(p),tras:()=>fTras(p),valor:()=>fValor(p),hato:()=>fHato(p),delFinca:()=>fDelFinca(p),renFinca:()=>fRen(p),cerrar:()=>fCerrar(p),
    addFinca:()=>{let i=D.fincas.length+1;while(D.fincas.some(f=>f.nombre==='Finca '+i))i++;D.fincas.push({id:uid(),nombre:'Finca '+i});save();render()}})[k]?.();
});
document.addEventListener('input',e=>{if(e.target.dataset?.mon){const el=e.target,before=el.value.slice(0,el.selectionStart).replace(/\D/g,'').length;el.value=miles(el.value);let p=0,k=0;while(p<el.value.length&&k<before){if(/\d/.test(el.value[p]))k++;p++}try{el.setSelectionRange(p,p)}catch(_){}return}if(e.target.id==='q'){q=e.target.value.trim();document.getElementById('res').innerHTML=resHTML()}});
document.addEventListener('change',e=>{if(e.target.dataset?.shrink&&e.target.files[0]){const f=e.target.form;f.dataset.cargando='1';f.querySelector('#fotoOk').textContent='Preparando foto…';shrink(e.target.files[0]).then(u=>{f.fotoData.value=u;delete f.dataset.cargando;f.querySelector('#fotoOk').textContent='Foto lista ✓';if(actual)guardarBorrador(f,1)});return}if(e.target.id==='rec'){const f=e.target.files[0];e.target.value='';if(f)fRecuperar(f);return}const id=e.target.dataset?.foto;if(id&&e.target.files[0])shrink(e.target.files[0]).then(u=>{animal(id).foto=u;save();render()})});
document.getElementById('back').onclick=()=>{cur=stack.pop()||{v:'inicio',p:null};render();scrollTo(0,0)};
document.getElementById('sol').onclick=()=>{D.sol=!D.sol;save();render()};
(async()=>{
  try{D=await idbGet('datos')}catch(e){}
  let bor=null;try{bor=await idbGet('borrador')}catch(e){}
  if(!D||!D.fincas){D=vacio();save()}
  try{persistente=await navigator.storage?.persist?.()||await navigator.storage?.persisted?.()||false}catch(e){}
  render();
  if(bor&&bor.act&&ACTS[bor.act.k])retomar(bor);
})();
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){const f=box.querySelector('form');if(f&&actual)guardarBorrador(f,1)}});
if('serviceWorker' in navigator){const habia=!!navigator.serviceWorker.controller;let ya=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!habia||ya)return;ya=true;if(!box.innerHTML){location.reload();return}const d=document.createElement('button');d.className='upd';d.textContent='Hay una versión nueva · tocá aquí cuando termines';d.onclick=()=>{if(box.querySelector('form')&&actual)guardarBorrador(box.querySelector('form'),1);setTimeout(()=>location.reload(),150)};document.body.appendChild(d)});addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}))}
}
</script>
</body>
